<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resource Library</title>
<style>
  :root {
    --bg: #fbfaf8; --panel: #ffffff; --ink: #1c1a17; --muted: #6b6459;
    --line: #e4dfd7; --accent: #7a4b1e; --accent-soft: #f3ece3;
    --warn-bg: #fdf6e7; --warn-line: #e0c68a; --warn-ink: #6b4f14;
    --stop-bg: #fbeceb; --stop-line: #dda9a3; --stop-ink: #7d2e26;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16151a; --panel: #1e1d23; --ink: #eceaf0; --muted: #9a94a3;
      --line: #302e38; --accent: #d9a066; --accent-soft: #2a2129;
      --warn-bg: #2a2417; --warn-line: #6a5624; --warn-ink: #e8ce93;
      --stop-bg: #2c1b1a; --stop-line: #7a3f38; --stop-ink: #f0b5ad;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  a { color: var(--accent); }
  header {
    position: sticky; top: 0; z-index: 5; background: var(--panel);
    border-bottom: 1px solid var(--line); padding: 14px 20px;
  }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 1180px; margin: 0 auto; }
  .bar h1 {
    font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .02em;
    white-space: nowrap; color: var(--muted);
  }
  #q {
    flex: 1; padding: 10px 13px; font-size: 15px; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 7px;
  }
  #q:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    font: inherit; padding: 10px 16px; border-radius: 7px; cursor: pointer;
    background: var(--accent); color: #fff; border: 1px solid transparent;
  }
  button.ghost { background: transparent; color: var(--muted); border-color: var(--line); }
  main { max-width: 1180px; margin: 0 auto; padding: 20px; display: grid;
         grid-template-columns: 260px 1fr; gap: 26px; align-items: start; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }

  .count { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  .count strong { color: var(--ink); }

  #applied { margin-bottom: 16px; }
  #applied .tag { cursor: pointer; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
             color: var(--muted); margin: 0 0 10px; }
  .facet { border-bottom: 1px solid var(--line); padding: 9px 0; }
  .facet > summary {
    cursor: pointer; font-size: 13px; font-weight: 600; list-style: none;
    display: flex; justify-content: space-between; align-items: center;
  }
  .facet > summary::-webkit-details-marker { display: none; }
  .facet > summary::after { content: "+"; color: var(--muted); font-weight: 400; }
  .facet[open] > summary::after { content: "−"; }
  .facet label {
    display: flex; gap: 7px; align-items: baseline; font-size: 13px;
    padding: 4px 0 4px 2px; cursor: pointer; color: var(--ink);
  }
  .facet label[hidden] { display: none; }
  .facet .n { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .facet .more {
    background: none; border: 0; padding: 3px 0 1px 2px; font-size: 12px;
    color: var(--accent); cursor: pointer; text-decoration: underline;
  }
  .axis-note { font-size: 12px; color: var(--muted); margin: 10px 0 0; }

  article {
    background: var(--panel); border: 1px solid var(--line); border-radius: 9px;
    padding: 15px 17px; margin-bottom: 12px;
  }
  article h3 { margin: 0 0 3px; font-size: 16px; font-weight: 640; }
  .repo { font-size: 12px; color: var(--muted); margin: 0 0 7px; }
  .desc { margin: 0 0 9px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    font-size: 11.5px; padding: 2.5px 8px; border-radius: 20px; cursor: pointer;
    background: var(--accent-soft); color: var(--ink);
    border: 1px solid var(--line); white-space: nowrap;
  }
  .tag:hover { border-color: var(--accent); }
  .tag.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tag.flat { cursor: default; opacity: .8; }
  .why { font-size: 12.5px; color: var(--muted); margin: 9px 0 0;
         border-left: 2px solid var(--line); padding-left: 9px; }

  .banner { border-radius: 9px; padding: 12px 15px; margin-bottom: 14px; font-size: 14px; }
  .banner.warn { background: var(--warn-bg); border: 1px solid var(--warn-line); color: var(--warn-ink); }
  .banner.stop { background: var(--stop-bg); border: 1px solid var(--stop-line); color: var(--stop-ink); }

  .components { margin-top: 22px; scroll-margin-top: 74px; }
  .components h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
                   color: var(--muted); margin: 0 0 9px; }
  .component { background: var(--panel); border: 1px solid var(--line);
               border-radius: 7px; padding: 9px 12px; margin-bottom: 7px; }
  .component code { font-size: 13px; }
  .empty { color: var(--muted); padding: 30px 0; }
  footer { max-width: 1180px; margin: 0 auto; padding: 0 20px 40px;
           color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <form class="bar" id="form">
    <h1>Resource Library</h1>
    <input id="q" name="q" placeholder="What are you trying to do?  e.g. parse SQL keeping comments"
           autocomplete="off" autofocus>
    <button type="submit">Search</button>
    <button type="button" class="ghost" id="clear">Clear filters</button>
  </form>
</header>

<main>
  <aside>
    <div id="applied"></div>
    <h2>Narrow by</h2>
    <div id="facets"></div>
    <p class="axis-note" id="axisnote"></p>
  </aside>

  <section>
    <div id="banners"></div>
    <p class="count" id="count"></p>
    <div id="results"></div>
    <div class="components" id="components"></div>
  </section>
</main>

<footer id="foot"></footer>

<script>
"use strict";
// No retrieval logic lives here. Every number, every ordering and every
// explanation on this page comes from `consult` via /api/search - the same
// functions the CLI and the MCP server call. A page that starts scoring things
// itself is a second opinion nobody asked for and cannot be reconciled.

const AXIS_LABELS = {
  license_class: "Licence", domain_primary: "Domain", ecosystem: "Ecosystem",
  maturity_stage: "Maturity", deployment_target: "Runs on",
  interface_protocol: "Interface", hardware_footprint: "Hardware",
  data_locality: "Data", agent_surface: "Agent surface",
  security_compliance: "Security"
};

const FACET_HEAD = 8;         // values shown before "show more"
const selected = new Map();   // axis -> Set(values)
const expanded = new Set();   // axes the reader opened past the head
let lastPayload = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function queryString() {
  const params = new URLSearchParams();
  params.set("q", $("q").value.trim());
  params.set("limit", "25");
  for (const [axis, values] of selected) {
    for (const value of values) params.append(axis, value);
  }
  return params.toString();
}

function toggle(axis, value) {
  if (!selected.has(axis)) selected.set(axis, new Set());
  const set = selected.get(axis);
  set.has(value) ? set.delete(value) : set.add(value);
  if (!set.size) selected.delete(axis);
  run();
}

function isOn(axis, value) {
  return selected.has(axis) && selected.get(axis).has(value);
}

async function run() {
  const url = "/api/search?" + queryString();
  history.replaceState(null, "", "?" + queryString());
  let payload;
  try {
    payload = await (await fetch(url)).json();
  } catch (err) {
    $("banners").innerHTML =
      '<div class="banner stop">The local server is not responding. ' +
      'Restart it with <code>python -m librarian web</code>.</div>';
    return;
  }
  lastPayload = payload;
  render(payload);
}

function render(p) {
  if (p.error) {
    $("banners").innerHTML = '<div class="banner stop">' + esc(p.error) + "</div>";
    $("results").innerHTML = ""; $("facets").innerHTML = "";
    $("count").textContent = ""; $("components").innerHTML = "";
    return;
  }

  // Advisories first and never collapsed. A constraint that removed the best
  // answer, or a question nothing here covers, is the most important thing on
  // the page - burying it is how a confident wrong answer gets acted on.
  const stop = (p.next_step || "").startsWith("nothing here covers this");
  $("banners").innerHTML = (p.advisories || [])
    .map((a) => '<div class="banner ' + (stop ? "stop" : "warn") + '">' + esc(a) + "</div>")
    .join("");

  const shown = (p.results || []).length;
  const active = [...selected.entries()]
    .map(([axis, values]) => (AXIS_LABELS[axis] || axis) + ": " + [...values].join(", "));
  const remaining = p.considered - p.filtered_out;
  $("count").innerHTML =
    (p.filtered_out
      ? "<strong>" + p.filtered_out + "</strong> of " + p.considered +
        " removed by " + esc(active.join("; ")) + " &nbsp;·&nbsp; " +
        "<strong>" + p.matched + "</strong> of the remaining " + remaining +
        " match your words"
      : "<strong>" + p.matched + "</strong> of " + p.considered +
        " catalogued match your words") +
    (shown && shown < p.matched ? " &nbsp;·&nbsp; showing " + shown : "") +
    ((p.components || []).length
      ? ' &nbsp;·&nbsp; <a href="#components">' + p.components.length +
        " file" + (p.components.length === 1 ? "" : "s") + " inside them matched too</a>"
      : "");

  $("results").innerHTML = shown
    ? p.results.map(card).join("")
    : '<p class="empty">Nothing matched. Try the vocabulary the domain itself uses, ' +
      "or clear a filter — filters remove results, they do not reorder them.</p>";

  $("components").innerHTML = (p.components || []).length
    ? "<h2>Inside those sources</h2>" + p.components.map(componentRow).join("")
    : "";

  $("applied").innerHTML = selected.size
    ? '<h2>Applied</h2><div class="tags">' +
      [...selected.entries()].flatMap(([axis, values]) => [...values].map((value) =>
        '<span class="tag on" data-axis="' + axis + '" data-value="' + esc(value) +
        '" title="Remove this filter">' + esc(AXIS_LABELS[axis] || axis) + ": " +
        esc(value) + " &times;</span>")).join("") + "</div>"
    : "";

  renderFacets(p.facets || {});
  $("foot").textContent = p.vault ? "vault: " + p.vault : "";
}

function card(r) {
  const f = r.fields || {};
  const url = f.canonical_url;
  const tags = Object.keys(AXIS_LABELS)
    .filter((axis) => f[axis])
    .map((axis) =>
      '<span class="tag' + (isOn(axis, f[axis]) ? " on" : "") + '" data-axis="' +
      axis + '" data-value="' + esc(f[axis]) + '" title="' +
      esc(AXIS_LABELS[axis]) + ' — click to filter">' + esc(f[axis]) + "</span>");
  // What a licence permits *here*, which is the question anyone actually asks
  // of one. Not clickable: it is derived, not a filterable axis.
  if (Array.isArray(f.permitted_uses)) {
    tags.push('<span class="tag flat" title="What this permits under the ' +
      'catalogue&#39;s current posture">' + esc(f.permitted_uses.join(" · ")) + "</span>");
  }
  return (
    "<article>" +
    "<h3>" + (url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener">' +
      esc(r.name) + "</a>" : esc(r.name)) + "</h3>" +
    '<p class="repo">' + esc(f.repo_key || "") +
      (f.stars != null ? " · " + f.stars + "★" : "") +
      (f.pushed_at ? " · pushed " + esc(String(f.pushed_at).slice(0, 10)) : "") + "</p>" +
    '<p class="desc">' + esc(f.bottom_line || "") + "</p>" +
    '<div class="tags">' + tags.join("") + "</div>" +
    '<p class="why">' + esc(r.why) + "</p>" +
    "</article>"
  );
}

function componentRow(c) {
  const f = c.fields || {};
  const addr = f.address || c.name;
  const label = f.canonical_url
    ? '<a href="' + esc(f.canonical_url) + '" target="_blank" rel="noopener">' +
      esc(f.repo_key || "") + "</a> &rsaquo; <code>" + esc(addr) + "</code>"
    : "<code>" + esc(addr) + "</code>";
  // Components are filtered on the same axes as their source. Showing the
  // values makes that visible; omitting them reads as a bypassed constraint.
  const tags = ["license_class", "ecosystem", "maturity_stage"]
    .filter((axis) => f[axis])
    .map((axis) => '<span class="tag flat">' + esc(f[axis]) + "</span>");
  return '<div class="component">' + label +
    (tags.length ? '<div class="tags" style="margin-top:6px">' + tags.join("") + "</div>" : "") +
    '<p class="why">' + esc(c.why) + "</p></div>";
}

function renderFacets(facets) {
  const axes = Object.keys(facets);
  // Only what the current results actually contain, with counts. A count is
  // the size of the set that survives choosing it, because filters eliminate
  // rather than re-rank - so this is the cost of a constraint, shown before
  // it is paid. An axis with one value is omitted by the engine: it would
  // narrow nothing.
  $("facets").innerHTML = axes.map((axis) => {
    const values = facets[axis];
    const chosen = values.filter((v) => isOn(axis, v.value)).length;
    return (
      '<details class="facet"' + (chosen || axes.indexOf(axis) < 3 ? " open" : "") + ">" +
      "<summary>" + esc(AXIS_LABELS[axis] || axis) +
      (chosen ? " (" + chosen + ")" : "") + "</summary>" +
      values.map((v, i) =>
        '<label' + (i >= FACET_HEAD && !expanded.has(axis) ? ' hidden' : "") +
        '><input type="checkbox" data-axis="' + axis + '" data-value="' +
        esc(v.value) + '"' + (isOn(axis, v.value) ? " checked" : "") + ">" +
        "<span>" + esc(v.value) + '</span><span class="n">' + v.count + "</span></label>"
      ).join("") +
      (values.length > FACET_HEAD
        ? '<button type="button" class="more" data-more="' + axis + '">' +
          (expanded.has(axis) ? "Show fewer"
            : "Show " + (values.length - FACET_HEAD) + " more") + "</button>"
        : "") + "</details>"
    );
  }).join("");

  $("axisnote").textContent = axes.length
    ? "Counts are what survives choosing that value. An axis disappears when every result shares it."
    : "";
}

$("facets").addEventListener("change", (event) => {
  const input = event.target.closest("input[data-axis]");
  if (input) toggle(input.dataset.axis, input.dataset.value);
});
$("facets").addEventListener("click", (event) => {
  const more = event.target.closest("[data-more]");
  if (!more) return;
  const axis = more.dataset.more;
  expanded.has(axis) ? expanded.delete(axis) : expanded.add(axis);
  render(lastPayload);            // no refetch: the facets did not change
});
$("applied").addEventListener("click", (event) => {
  const tag = event.target.closest(".tag[data-axis]");
  if (tag) toggle(tag.dataset.axis, tag.dataset.value);
});
$("results").addEventListener("click", (event) => {
  const tag = event.target.closest(".tag[data-axis]");
  if (tag) toggle(tag.dataset.axis, tag.dataset.value);
});

$("form").addEventListener("submit", (event) => { event.preventDefault(); run(); });
$("clear").addEventListener("click", () => {
  selected.clear(); expanded.clear(); run();
});

const initial = new URLSearchParams(location.search);
$("q").value = initial.get("q") || "";
for (const [key, value] of initial) {
  if (key === "q" || key === "limit") continue;
  if (!selected.has(key)) selected.set(key, new Set());
  selected.get(key).add(value);
}
run();
</script>
</body>
</html>
